# Tuning parameters of the evaluate stage (the `evaluate`/`pipeline` stages of
# `hm-ibf-robo`), loaded at startup — see `--evaluation-params` in `hm-ibf --help`.
#
# Evaluation replays the trained graph's stored, IRACE-tuned parameters instead of
# sampling new ones, so the island bounds below only shape the parameter space and never
# change a run's outcome.

# Upper bound IRACE may assign to an island's iteration count when rebuilding the trained
# graph.
max_iterations = 100
# Island population bound used when rebuilding the trained graph.
max_population_size = 128
# Tolerance when cross-checking the exported best value against the run's state.
best_value_tolerance = 1e-9
